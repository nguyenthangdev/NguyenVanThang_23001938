services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      DB_NAME: shopping_cart
      DB_USER: shopping_user
      DB_PASSWORD: shopping_password
    volumes:
      - ./app:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: shopping_cart
      MYSQL_USER: shopping_user
      MYSQL_PASSWORD: shopping_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_USER: shopping_user
      PMA_PASSWORD: shopping_password
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
